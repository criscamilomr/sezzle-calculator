services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sezzle-calculator-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: sezzle-calculator-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
